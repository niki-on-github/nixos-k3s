apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: ${APP_NAME}-restic-src-credentials
  namespace: ${APP_NAMESPACE}
stringData:
  AWS_ACCESS_KEY_ID: ${SECRET_S3_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${SECRET_S3_SECRET_KEY}
  RESTIC_REPOSITORY: "s3:http://${CONFIG_S3_BACKUP_SRC_ENDPOINT}/${BACKUP_VOLSYNC_BUCKET:-volsync}/${APP_NAME}"
  RESTIC_PASSWORD: "${SECRET_VOLSYNC_RESTIC_PASSWORD}"
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: ${APP_NAME}-restic-dest-credentials
  namespace: ${APP_NAMESPACE}
stringData:
  AWS_ACCESS_KEY_ID: ${SECRET_S3_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${SECRET_S3_SECRET_KEY}
  RESTIC_REPOSITORY: "s3:http://${CONFIG_S3_BACKUP_DEST_ENDPOINT}/${BACKUP_VOLSYNC_BUCKET:-volsync}/${APP_NAME}"
  RESTIC_PASSWORD: "${SECRET_VOLSYNC_RESTIC_PASSWORD}"
