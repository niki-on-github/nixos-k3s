# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      ${APP_NAME}:
        initContainers:
          init:
            image:
              repository: docker.io/busybox
              tag: "1.37.0"
            command:
            - "/bin/mkdir"
            args:
            - "-m"
            - "0777"
            - "-p"
            - "/init/redis"
            - "/init/docmost"

        containers:
          redis:
            image:
              # renovate: datasource=docker
              repository: docker.io/library/redis
              tag: 8.6.3

          app:
            image:
              repository: docker.io/docmost/docmost
              tag: 0.70.3@sha256:6b7fa05af3401faaa8963fd722e69994abf7eb51b17fdeb59c1ded25cf98cc25

            env:
              APP_URL: "https://docmost.${SECRET_DOMAIN}"
              APP_SECRET: "${SECRET_DOCMOST_APP_SECRET}"
              REDIS_URL: "redis://127.0.0.1:6379"
              DATABASE_URL: 
                valueFrom:
                  secretKeyRef:
                    name: "${APP_NAME}-postgresql-credentials"
                    key: url

    service:
      webui:
        controller: ${APP_NAME}
        ports:
          http:
            port: 3000

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress "docmost.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress
        
    persistence:
      data:
        existingClaim: "${APP_NAME}-pvc"
        advancedMounts:
          ${APP_NAME}:
            init:
            - path: /init
            app:
            - path: /app/data/storage
              subPath: docmost
            redis:
            - path: /data
              subPath: redis
