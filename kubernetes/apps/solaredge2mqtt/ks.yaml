apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: solaredge2mqtt
  namespace: flux-system
spec:
  path: "./kubernetes/apps/solaredge2mqtt/app"
  dependsOn:
    - name: mosquitto
    - name: influxdb2
  postBuild:
    substitute:
      APP_NAME: solaredge2mqtt
      APP_NAMESPACE: home-automation
      PVC_CAPACITY: "2Gi"
