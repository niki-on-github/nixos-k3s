apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radicale
  namespace: flux-system
spec:
  path: "./kubernetes/apps/radicale/app"
  dependsOn:
    - name: tailscale
  postBuild:
    substitute:
      APP_NAME: radicale
      APP_NAMESPACE: apps
      PVC_CAPACITY: "2Gi"
