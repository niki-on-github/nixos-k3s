# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    controllers:
      ${APP_NAME}:
        containers:
          app:
            image:
              repository: docker.io/tomsquest/docker-radicale
              tag: 3.6.1.0@sha256:a594c624c5a6a092d7054d1c48f1fcd87e281d686c41a1dec9aa8bc35f8ef785
      agendav:
        containers:
          app:
            image: 
              repository: ghcr.io/nagimov/agendav-docker
              tag: 2.6.0
            env:
              AGENDAV_SERVER_NAME: "agendav.${SECRET_DOMAIN}"
              AGENDAV_TITLE: "Welcome to Agendav Server"
              AGENDAV_FOOTER: "Agendav Server"
              AGENDAV_CALDAV_SERVER: http://radicale.${APP_NAMESPACE}.svc.cluster.local:5232/%u
              AGENDAV_CALDAV_PUBLIC_URL: https://radicale.${SECRET_DOMAIN}
              AGENDAV_TIMEZONE: ${CONFIG_TIMEZONE}
              AGENDAV_LANG: de
              AGENDAV_LOG_DIR: /tmp/

    service:
      radicale:
        controller: ${APP_NAME}
        ports:
          http:
            port: 5232
      agendav:
        controller: agendav
        ports:
          http:
            port: 8080

    ingress:
      radicale:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
          #NOTE: Use higher priority than default http to https redirect priority specified in traefik helm chart
          traefik.ingress.kubernetes.io/router.priority: "20"
        hosts:
          - host: &ingress1 "radicale.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: radicale
                  port: http
        tls:
          - hosts:
              - *ingress1

      agendav:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress2 "agendav.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: agendav
                  port: http
        tls:
          - hosts:
              - *ingress2

      tailscale:
        className: tailscale
        hosts:
          - host: "${APP_NAME}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: radicale
                  port: http
        tls:
          - hosts:
              - "${APP_NAME}"
    
    configMaps:
      setup:
        suffix: config
        data:
          config: |
            [server]
            hosts = 0.0.0.0:5232

            [auth]
            type = htpasswd
            htpasswd_filename = /config/users
            htpasswd_encryption = bcrypt

            [storage]
            filesystem_folder = /data/collections
          users: |
            ${SECRET_RADICALE_USER}

    persistence:
      data:
        existingClaim: "${APP_NAME}-pvc"
        advancedMounts:
          ${APP_NAME}:
            app:
            - path: /data
      config:
        type: configMap
        name: ${APP_NAME}-config
        advancedMounts:
          ${APP_NAME}:
            app:
            - path: /config
