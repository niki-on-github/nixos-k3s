apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  selector:
    matchLabels:
      app: ${APP_NAME}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
    spec:
      hostNetwork: false
      hostPID: true
      hostIPC: true
      containers:
      - name: ${APP_NAME}
        image: ghcr.io/niki-on-github/container-image-puller:v0.4.2
        securityContext:
          privileged: true
        env:
        - name: PRUNE_SCHEDULE
          value: "0 3 * * *"
        - name: PRUNE_DAYS
          value: "30"
        - name: DEBUG
          value: "0"
        - name: IGNORE_PRUNE_NAMES
          value: "quay.io/backube/volsync:0.13.1,docker.io/library/busybox:1.37.0,docker.io/rancher/mirrored-pause:3.6"
        volumeMounts:
        - mountPath: /host
          name: host
        ports:
        - containerPort: 8080
      volumes:
      - name: host
        hostPath:
          path: /
---
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  selector:
    app: ${APP_NAME}
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
