# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    controllers:
      ${APP_NAME}:
        containers:
          app:
            image:
              repository: ghcr.io/niki-on-github/portfolio-performance
              tag: "v0.80.4@sha256:af3eca8ddf996d4518d1e91068b3b458e22990f5fabd5b473cb1d291e3f6bed2"
            env:
              TZ: "${CONFIG_TIMEZONE}"
              UMASK: "000"

    service:
      webui:
        controller: ${APP_NAME}
        ports:
          http:
            port: 5800

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: "authentication-auth@kubernetescrd"
        hosts:
          - host: &ingress "portfolio.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress
        
    persistence:
      data:
        existingClaim: "${APP_NAME}-pvc"
        globalMounts:
          - path: /data
      import:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 4Gi
        storageClass: "${CONFIG_NFS_STORAGE_CLASS_NAME}"
        globalMounts:
          - path: /import
