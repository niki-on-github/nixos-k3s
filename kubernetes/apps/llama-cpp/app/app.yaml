# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    controllers:
      ${APP_NAME}:
        containers:
          app:
            image:
              repository:  ghcr.io/ggml-org/llama.cpp
              tag: "server@sha256:0aaa104a381d3b05d8cb8c28e6118907bbcaeff26e4810a046fd7474c42fc4b4"
            env:
              NVIDIA_VISIBLE_DEVICES: all
              NVIDIA_DRIVER_CAPABILITIES: all
              LLAMA_CACHE: "/models"
            args:
              - --port
              - "8080"
              - --host
              - 0.0.0.0
              - --models-preset 
              - /models/config.ini
    service:
      webui:
        controller: ${APP_NAME}
        ports:
          http:
            port: 8080

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress1 "llama-cpp.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress1

    configMaps:
      setup:
        suffix: config
        data:
          config.ini: |
            [*]
            models-max = 2
            models-autoload = 0
            sleep-idle-seconds = 120
            warmup = 0
            fit = 1
            mmap = 0

            [Gemma4-E2B-Q4-KV8]
            hf-repo = unsloth/gemma-4-E2B-it-GGUF
            hf-file = gemma-4-E2B-it-UD-Q4_K_XL.gguf
            temp = 1.0
            min-p = 0.00
            top-p = 0.95
            top-k = 64
            ctx-size = 16384
            cache-type-k = q8_0
            cache-type-v = q8_0

            [embeddinggemma-300m]
            hf-repo = unsloth/embeddinggemma-300m-GGUF
            hf-file = embeddinggemma-300m-Q4_0.gguf
            ctx-size = 2048

    persistence:
      data:
        suffix: data
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: ${PVC_CAPACITY}
        storageClass: "openebs-zfspv-reprovisioned"
        globalMounts:
          - path: /models
      config:
        type: configMap
        name: ${APP_NAME}-config
        advancedMounts:
        globalMounts:
            - path: /models/config.ini
              subPath: config.ini
