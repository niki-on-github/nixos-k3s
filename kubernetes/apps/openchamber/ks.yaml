apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchamber
  namespace: flux-system
spec:
  path: "./kubernetes/apps/openchamber/app"
  dependsOn:
    - name: tailscale
  postBuild:
    substitute:
      APP_NAME: openchamber
      APP_NAMESPACE: apps
      PVC_CAPACITY: "16Gi"
