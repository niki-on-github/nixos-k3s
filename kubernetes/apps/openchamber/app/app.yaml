# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      ${APP_NAME}:
        initContainers:
          init:
            image:
              repository: docker.io/busybox
              tag: "1.37.0"
            command:
            - "/bin/mkdir"
            args:
            - "-m"
            - "777"
            - "-p"
            - "/init/openchamber"
            - "/init/opencode/share"
            - "/init/opencode/state"
            - "/init/opencode/config"
            - "/init/ssh"
            - "/init/workspaces"

        containers:
          app:
            image:
              repository: ghcr.io/niki-on-github/openchamber-container
              tag: "v1.9.7"
            env:
              UI_PASSWORD: "${SECRET_WEBSERVICES_PASSWORD}"
          
          code:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.106.3@sha256:1a0e813039c8f01404a89654278779ac77492b833bc2d126431268b9b1f1e40a
            env:
              TZ: ${CONFIG_TIMEZONE}
            args:
              - --auth
              - "none"
              - --user-data-dir
              - "/config/.vscode"
              - --extensions-dir
              - "/config/.vscode"
              - "--port"
              - "80"
              - /config

    service:
      webui:
        controller: ${APP_NAME}
        ports:
          http:
            port: 3000
          code:
            port: 80

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress "openchamber.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress
      code:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: "authentication-auth@kubernetescrd"
        hosts:
          - host: &ingress2 "openchamber-code.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: code
        tls:
          - hosts:
              - *ingress2
      tailscale:
        className: tailscale
        hosts:
          - host: "${APP_NAME}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - "${APP_NAME}"

    persistence:
      data:
        existingClaim: "${APP_NAME}-pvc"
        advancedMounts:
          ${APP_NAME}:
            init:
              - path: /init
            code:
              - path: /config
            app:
              - path: /home/openchamber/.config/openchamber
                subPath: openchamber
              - path: /home/openchamber/.local/share/opencode
                subPath: opencode/share
              - path: /home/openchamber/.local/state/opencode
                subPath: opencode/state
              - path: /home/openchamber/.config/opencode
                subPath: opencode/config
              - path: /home/openchamber/.ssh
                subPath: ssh
              - path: /home/openchamber/workspaces
                subPath: workspaces
             
