# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    controllers:
      ${APP_NAME}:
        pod:
          annotations:
            # required to send wol packages
            k8s.v1.cni.cncf.io/networks: networking/multus-br1

        initContainers:
          setup:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2025.12.0@sha256:8951fcbb794da8f261e1639c668639bc90f9520b48099b5715f6d5fbfef08a0e
            command:
            - "/bin/bash"
            args:
            - "/setup.sh"
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: "2026.3"
          
            env:
              # NOTE: hass does not support env-variables for configuration directly, but you can use/load env variables in configuration.yaml with `!env_var VAR_NAME`
              HASS_TRUSTED_PROXIES: ${CONFIG_CLUSTER_PODS_NETWORK_IP_POOL}
              HASS_RECORDER_DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: "${APP_NAME}-postgresql-credentials"
                    key: url

    service:
      webui:
        controller: ${APP_NAME}
        ports:
          http:
            port: 8123

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress "home.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress

      tailscale:
        className: tailscale
        hosts:
          - host: "${APP_NAME}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - "${APP_NAME}"
        
    configMaps:
      scripts:
        suffix: scripts
        data:
          setup.sh: |
            #!/bin/bash
            echo "run $0"
            cp -nv /setup/* /config/
            mkdir -p "/config/python_scripts"
            mkdir -p "/config/custom_components"
            if [ ! -d "/config/custom_components/hacs" ]; then
              wget "https://github.com/hacs/integration/releases/latest/download/hacs.zip" -O "/config/custom_components/hacs.zip"
              mkdir -p "/config/custom_components/hacs"
              unzip "/config/custom_components/hacs.zip" -d "/config/custom_components/hacs"
              rm -f /config/custom_components/hacs.zip
            fi
 
    persistence:
      config:
        existingClaim: "${APP_NAME}-pvc"
        advancedMounts:
          ${APP_NAME}:
            app:
              - path: /config
            setup:
              - path: /config
      setup:
        type: configMap
        name: home-assistant-setup
        advancedMounts:
          ${APP_NAME}:
            setup:
              - path: /setup
      scripts:
        type: configMap
        name: ${APP_NAME}-scripts
        advancedMounts:
          ${APP_NAME}:
            setup:
              - path: /setup.sh
                subPath: setup.sh
      certs:
        type: secret
        name: internal-ca
        globalMounts:
          - path: /etc/ssl/certs/internal-ca.pem
            subPath: tls.crt
