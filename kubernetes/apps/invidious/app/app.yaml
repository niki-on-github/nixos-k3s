# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    controllers:
      ${APP_NAME}:
        containers:
          app:
            image:
              repository: quay.io/invidious/invidious
              tag: latest@sha256:9d972ea5930c2e170b3c4d49bdd9fa09bf03f077d555f58747342062dffc5876
            env:
              INVIDIOUS_CONFIG: |
                db:
                  dbname: "${POSTGRES_DATABASE}"
                  user: "${SECRET_DATABASE_USER}"
                  password: "${SECRET_DATABASE_PASSWORD}"
                  host: ${APP_NAME}-postgresql-rw.${CONFIG_DATABASE_NAMESPACE}.svc.cluster.local
                  port: 5432
                check_tables: true
                invidious_companion:
                - private_url: "http://${APP_NAME}-companion.${APP_NAMESPACE}.svc.cluster.local:8282/companion"
                invidious_companion_key: "${SECRET_INVIDIOUS_COMPANION_KEY}"
                external_port: 443
                domain: "invidious.${SECRET_DOMAIN}"
                https_only: true
                captcha_enabled: false
                hmac_key: "${SECRET_INVIDIOUS_HMAC_KEY}"
                popular_enabled: false
                default_user_preferences:
                  locale: de
                  region: DE
                  autoplay: false
                  continue: false
                  speed: 2.0
                  default_home:

      companion:
        containers:
          app:
            image:
              repository: quay.io/invidious/invidious-companion
              tag: latest@sha256:1ddd3f1c6ba5c4b8b786b91830926bb510376918a7d43b2f142df6650c239951
            env:
              SERVER_SECRET_KEY: "${SECRET_INVIDIOUS_COMPANION_KEY}"
 
    service:
      webui:
        controller: ${APP_NAME}
        ports:
          http:
            port: 3000
      companion:
        controller: companion
        ports:
          http:
            port: 8282

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress "invidious.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress
      tailscale:
        className: tailscale
        hosts:
          - host: "${APP_NAME}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - "${APP_NAME}"

    persistence:
      cache:
        suffix: cache
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: ${PVC_CAPACITY}
        storageClass: "openebs-zfspv-reprovisioned"
        advancedMounts:
          companion:
            app:
              - path: /var/tmp/youtubei.js
   
