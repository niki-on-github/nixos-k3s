apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: invidious-db
  namespace: flux-system
spec:
  path: "./kubernetes/templates/postgres"
  wait: true
  postBuild:
    substitute:
      APP_NAME: invidious
      APP_NAMESPACE: media
      POSTGRES_DATABASE: "invidious"
      POSTGRES_MAJOR: "16"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: invidious
  namespace: flux-system
spec:
  path: "./kubernetes/apps/invidious/app"
  dependsOn:
    - name: invidious-db
    - name: tailscale
  postBuild:
    substitute:
      APP_NAME: invidious
      APP_NAMESPACE: media
      POSTGRES_DATABASE: "invidious"
      PVC_CAPACITY: "32Gi"
