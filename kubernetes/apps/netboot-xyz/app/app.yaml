# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    defaultPodOptions:
      dnsPolicy: ClusterFirstWithHostNet

    controllers:
      ${APP_NAME}:
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: networking/multus-br1
        containers:
          app:
            image:
              repository: ghcr.io/niki-on-github/netboot-xyz
              tag: "v2.0.89@sha256:342de491c930cd9a9cab5f1755d913e1cc657faeaaad53e369beb57364c35b26"
            env:
              NETWORK_IP: "${CONFIG_NETBOOT_XYZ_HOST_NETWORK_IP}"
              # INTERFACE: "${CONFIG_NETBOOT_XYZ_HOST_INTERFACE}"
              INTERFACE: "net1" # multus interface

            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
              privileged: true

