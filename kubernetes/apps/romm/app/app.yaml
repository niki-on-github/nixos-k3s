# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    controllers:
      ${APP_NAME}:
        initContainers:
          init:
            image:
              repository: docker.io/busybox
              tag: "1.37.0"
            command:
            - "/bin/sh"
            args:
            - "/init.sh"

        containers:
          app:
            image:
              repository: docker.io/rommapp/romm
              tag: 4.7.0
            env:
              ROMM_DB_DRIVER: postgresql
              DB_PORT: "5432"
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: &postgresqlCredentials "${APP_NAME}-postgresql-credentials"
                    key: username
              DB_PASSWD:
                valueFrom:
                  secretKeyRef:
                    name: *postgresqlCredentials
                    key: password
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: *postgresqlCredentials
                    key: database
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: *postgresqlCredentials
                    key: uri

              # see https://docs.romm.app/latest/Getting-Started/Quick-Start-Guide
              ROMM_AUTH_SECRET_KEY: "${SECRET_ROMM_AUTH_KEY}"
              SCREENSCRAPER_USER: "${SECRET_SCREENSCRAPER_USER}"
              SCREENSCRAPER_PASSWORD: "${SECRET_SCREENSCRAPER_PASSWORD}"
              STEAMGRIDDB_API_KEY: "${SECRET_STEAMGRIDDB_API_KEY}"
              HASHEOUS_API_ENABLED: "true"
 
 
    service:
      webui:
        controller: ${APP_NAME}
        ports:
          http:
            port: 8080

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress "romm.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress

      tailscale:
        className: tailscale
        hosts:
          - host: "${APP_NAME}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - "${APP_NAME}"

    configMaps:
      scripts:
        suffix: scripts
        data:
          init.sh: |
            #!/bin/sh
            echo "run $0"
            mkdir -m 0755 -p /init/resources /init/library /init/assets /init/config
            ls /init
            cp -nv /init/config.yml /init/config/config.yml

    persistence:
      data:
        existingClaim: "${APP_NAME}-pvc"
        advancedMounts:
          ${APP_NAME}:
            init:
              - path: /init
            app:
              - path: /romm/resources
                subPath: resources
              - path: /romm/library
                subPath: library
              - path: /romm/assets
                subPath: assets
              - path: /romm/config
                subPath: config
      cache:
        enabled: true
        type: emptyDir
        medium: Memory
        advancedMounts:
          ${APP_NAME}:
            app:
              - path: /redis-data
      config:
        type: configMap
        name: ${APP_NAME}-config
        advancedMounts:
          ${APP_NAME}:
            init:
              - path: /init/config.yml
                subPath: config.yml
      scripts:
        type: configMap
        name: ${APP_NAME}-scripts
        advancedMounts:
          ${APP_NAME}:
            init:
              - path: /init.sh
                subPath: init.sh
