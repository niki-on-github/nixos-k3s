apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  buffering:
    maxRequestBodyBytes: 10000000000
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    controllers:
      ${APP_NAME}:
        containers:
          app:
            image:
              repository: openspeedtest/latest
              tag: "v2.0.6"
            env:
              MODE: standalone

    service:
      webui:
        controller: ${APP_NAME}
        type: LoadBalancer
        loadBalancerIP: "${CONFIG_KUBE_VIP_IP}"
        annotations:
          external-dns.alpha.kubernetes.io/hostname: speedtest.${SECRET_DOMAIN}
        ports:
          http:
            # port from outside
            port: 3001
            targetPort: 3000
            protocol: TCP
