# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    controllers:
      ${APP_NAME}:
        containers:
          app:
            image:
              repository: ghcr.io/diegosouzapw/omniroute
              tag: "3.6.9"
            env:
              DATA_DIR: /app/data
              PORT: &port 20128
              NEXT_PUBLIC_BASE_URL: https://omni-route.${SECRET_DOMAIN}
              NODE_EXTRA_CA_CERTS: /etc/ssl/certs/internal-ca.pem
              INITIAL_PASSWORD: "${SECRET_WEBSERVICES_PASSWORD}"

    service:
      webui:
        controller: ${APP_NAME}
        ports:
          http:
            port: *port

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress1 "omni-route.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress1
      tailscale:
        className: tailscale
        hosts:
          - host: "${APP_NAME}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - "${APP_NAME}"

    persistence:
      data:
        existingClaim: "${APP_NAME}-pvc"
        advancedMounts:
          ${APP_NAME}:
            app:
            - path: /app/data
      certs:
        type: secret
        name: internal-ca
        globalMounts:
          - path: /etc/ssl/certs/internal-ca.pem
            subPath: tls.crt



