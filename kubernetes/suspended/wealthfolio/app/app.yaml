# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    controllers:
      ${APP_NAME}:
        containers:
          app:
            image:
              repository: docker.io/afadil/wealthfolio
              tag: "3.1.2@sha256:6862b342339e4bc1d23c3a04104b4a703f16e7ecbf2f08cc62e20f9a23b82807"
            env:
              WF_LISTEN_ADDR: 0.0.0.0:8088
              WF_DB_PATH: /data/wealthfolio.db
              WF_SECRET_KEY: "${SECRET_WEALTHFOLIO_SECRET_KEY}"
              WF_CORS_ALLOW_ORIGINS: "*"
              WF_REQUEST_TIMEOUT_MS: 30000
              WF_STATIC_DIR: dist
              WF_AUTH_REQUIRED: false

              
    service:
      webui:
        controller: ${APP_NAME}
        ports:
          http:
            port: 8088

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: "authentication-auth@kubernetescrd"
        hosts:
          - host: &ingress "wealthfolio.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress
        
    persistence:
      data:
        existingClaim: "${APP_NAME}-pvc"
        globalMounts:
          - path: /data/

