# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: ollama
      version: 1.38.0
      sourceRef:
        kind: HelmRepository
        name: ollama-charts
        namespace: flux-system

  values:
    updateStrategy:
      type: "Recreate"
    image:
      repository: docker.io/ollama/ollama
      tag: "0.15.0@sha256:4e158ee038728a7ec7f2e57fadc8a870f4c30cf7cc336b0d3424514543db1528"
      pullPolicy: IfNotPresent
    extraEnv:
      - name: OLLAMA_CONTEXT_LENGTH
        value: "16384"
    persistentVolume:
      enabled: true
      storageClass: "openebs-zfspv-reprovisioned"
    ollama:
      port: 11434
      models:
        # in your config add models via CONFIG_OLLAMA_PULL_MODELS: "[\"gemma3:1b-it-qat\"]"
        pull: ${CONFIG_OLLAMA_PULL_MODELS}
