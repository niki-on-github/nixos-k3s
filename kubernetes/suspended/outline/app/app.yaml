# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    controllers:
      ${APP_NAME}:
        containers:
          redis:
            image:
              # renovate: datasource=docker
              repository: docker.io/library/redis
              tag: 8.2.2

          app:
            image:
              repository: docker.io/outlinewiki/outline
              tag: 1.0.1

            env:
              NODE_ENV: production
              URL: "https://outline.${SECRET_DOMAIN}"
              PORT: "3000"
              WEB_CONCURRENCY: "1"
              SECRET_KEY: "${SECRET_OUTLINE_APP_SECRET}"
              UTILS_SECRET: "${SECRET_OUTLINE_APP_SECRET}"
              DEFAULT_LANGUAGE: "de_DE"
              REDIS_URL: "redis://127.0.0.1:6379"
              FILE_STORAGE: local
              FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
              FILE_STORAGE_UPLOAD_MAX_SIZE: 262144000
              RATE_LIMITER_ENABLED: "false"
              ENABLE_UPDATES: "false"
              OIDC_DISPLAY_NAME: "pocket-id"
              OIDC_CLIENT_ID: "${SECRET_OUTLINE_CLIENT_ID}"
              OIDC_CLIENT_SECRET: "${SECRET_OUTLINE_CLIENT_SECRET}"
              OIDC_AUTH_URI: "https://id.${SECRET_DOMAIN}/authorize"
              OIDC_TOKEN_URI: "http://pocket-id.authentication.svc:1411/api/oidc/token"
              OIDC_USERINFO_URI: "http://pocket-id.authentication.svc:1411/api/oidc/userinfo"
              OIDC_LOGOUT_URI: "http://pocket-id.authentication.svc:1411/api/oidc/end-session"
              OIDC_SCOPES: "openid profile email"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "${APP_NAME}-postgresql-credentials"
                    key: url

    service:
      webui:
        controller: ${APP_NAME}
        ports:
          http:
            port: 3000

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress "outline.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress
        
    persistence:
      data:
        existingClaim: "${APP_NAME}-pvc"
        advancedMounts:
          ${APP_NAME}:
            app:
            - path: /var/lib/outline/data
