# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: "${APP_NAME}"
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.5.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      "${APP_NAME}":
        containers:
          app:
            image:
              repository: docker.n8n.io/n8nio/n8n
              tag: "1.123.1@sha256:cbb838c888f8d849afcb855d34390c6644ebad2c51010a0a12c3b83960a5b3f7"

            env:
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
              N8N_HOST: "n8n.${SECRET_DOMAIN}"
              N8N_PORT: "5678"
              N8N_PROTOCOL: "http"
              N8N_RUNNERS_ENABLED: "true"
              NODE_ENV: "production"
              WEBHOOK_URL: "https://n8n.${SECRET_DOMAIN}/"
              GENERIC_TIMEZONE: "${CONFIG_TIMEZONE}"
              TZ: "${CONFIG_TIMEZONE}"

    service:
      webui:
        controller: "${APP_NAME}"
        ports:
          http:
            port: 5678

    ingress:
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress "n8n.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
                  port: http
        tls:
          - hosts:
              - *ingress

    persistence:
      data:
        existingClaim: "${APP_NAME}-pvc"
        advancedMounts:
          "${APP_NAME}":
            app:
              - path: /home/node/.n8n
