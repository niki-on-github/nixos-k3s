apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kestra-db
  namespace: flux-system
spec:
  path: "./kubernetes/templates/postgres"
  wait: true
  postBuild:
    substitute:
      APP_NAME: kestra
      APP_NAMESPACE: apps
      POSTGRES_DATABASE: "kestra"
      POSTGRES_MAJOR: "16"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kestra
  namespace: flux-system
spec:
  path: "./kubernetes/apps/kestra/app"
  dependsOn:
    - name: kestra-db
  postBuild:
    substitute:
      APP_NAME: kestra
      APP_NAMESPACE: apps
      PVC_CAPACITY: "16Gi"
      POSTGRES_DATABASE: "kestra"
