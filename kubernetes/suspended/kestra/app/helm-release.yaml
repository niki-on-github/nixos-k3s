# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: kestra
      version: 1.0.24
      sourceRef:
        kind: HelmRepository
        name: kestra-charts
        namespace: flux-system

  values:
    common:
      replicas: 1
      extraVolumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: "${APP_NAME}-pvc"

      extraVolumeMounts:
        - name: app-storage
          mountPath: &storagePath "/app/storage"
          readOnly: false

    ingress:
      enabled: true
      className: traefik
      annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: &host "kestra.${SECRET_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - *host

    configurations:
      application:
        datasources:
          postgres:
            url: "jdbc:postgresql://${APP_NAME}-postgresql-rw.${CONFIG_DATABASE_NAMESPACE}.svc.cluster.local:5432/${POSTGRES_DATABASE}"
            driver-class-name: org.postgresql.Driver
            username: "${SECRET_DATABASE_USER}"
            password: "${SECRET_DATABASE_PASSWORD}"
        kestra:
          server:
            basic-auth:
              username: "admin@${SECRET_DOMAIN}"
              password: "${SECRET_WEBSERVICES_PASSWORD}"
          queue:
            type: postgres
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: *storagePath

