# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    controllers:
      ${APP_NAME}:
        initContainers:
          init:
            image: 
              repository: docker.io/busybox
              tag: "1.37.0"
            command: 
             - "/bin/sh"
            args:
              - -c
              - |
                chown -R 10001:10001 /data /logs || true
                chmod -R 755 /data /logs || true
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0

        containers:
          app:
            image:
              repository: docker.io/rustfs/rustfs
              tag: "1.0.0-beta.1"
            envFrom:
            - secretRef:
                name: ${APP_NAME}-secrets
            env:
              RUSTFS_CONSOLE_ENABLE: true
              RUSTFS_SERVER_DOMAINS: "rustfs-s3.${SECRET_DOMAIN},${APP_NAME}.${APP_NAMESPACE}.svc.cluster.local:9000"
              RUSTFS_REGION: "${CONFIG_S3_RUSTFS_REGION}"

    service:
      api:
        controller: ${APP_NAME}
        ports:
          s3:
            port: 9000
          web:
            port: 9001

    ingress:
      s3:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &ingress1 "rustfs-s3.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: api
                  port: s3
          - host: &ingress2 "*.rustfs-s3.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: api
                  port: s3
        tls:
          - hosts:
            - *ingress1
            - *ingress2
      webui:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: "authentication-auth@kubernetescrd"
        hosts:
          - host: &ingress3 "rustfs.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: api
                  port: web
        tls:
          - hosts:
            - *ingress3
    
    secrets:
      secrets:
        suffix: secrets
        stringData:
          RUSTFS_ACCESS_KEY: "${SECRET_S3_KEY_ID}"
          RUSTFS_SECRET_KEY: "${SECRET_S3_SECRET_KEY}"

    persistence:
      data:
        type: hostPath
        hostPath: /mnt/backup/rustfs
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /data
      log:
        type: emptyDir
        globalMounts:
          - path: /logs

