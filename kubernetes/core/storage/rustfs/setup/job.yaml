apiVersion: batch/v1
kind: Job
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  template:
    metadata:
      labels:
        app: rustfs-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-rustfs
          image: busybox:1.36
          command: ["/bin/sh"]
          args:
            - -c
            - |
              until nc -z rustfs.storage.svc.cluster.local 9000; do
                echo 'waiting for rustfs...';
                sleep 2;
              done;
              sleep 20
              echo 'rustfs ready';
      containers:
        - name: configure
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh"]
          args:
            - -c
            - |
              mc alias set rustfs http://rustfs.storage.svc.cluster.local:9000 ${SECRET_S3_KEY_ID} ${SECRET_S3_SECRET_KEY}
              mc mb rustfs/volsync || true
              mc mb rustfs/postgres || true
              mc mb rustfs/blockchain || true

